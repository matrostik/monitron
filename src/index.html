<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LG Monitor Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="window-frame">
    <!-- macOS Title Bar -->
    <header class="titlebar">
      <div class="traffic-lights">
        <button class="traffic-light close" id="win-close" aria-label="Close" title="Close">
          <svg class="traffic-icon" viewBox="0 0 12 12"><path d="M3.5 3.5l5 5m0-5l-5 5" stroke="#4c0000" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <button class="traffic-light minimize" id="win-minimize" aria-label="Minimize" title="Minimize">
          <svg class="traffic-icon" viewBox="0 0 12 12"><path d="M2.5 6h7" stroke="#5c4300" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <button class="traffic-light zoom" id="win-zoom" aria-label="Refresh" title="Refresh">
          <svg class="traffic-icon" viewBox="0 0 12 12"><path d="M6 2.5v7m-3.5-3.5h7" stroke="#004c08" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="window-title">LG Monitor Control</div>
      <button class="titlebar-btn" id="title-refresh" title="Refresh monitor volume">
        <svg class="icon" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
        </svg>
      </button>
    </header>

    <!-- Main Content -->
    <main class="app-body">
      <!-- Device Card -->
      <section class="device-card">
        <div class="device-icon-wrap">
          <svg class="display-svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        <div class="device-info">
          <div class="device-name">LG UltraWide 49WQ95C</div>
          <div class="device-desc">Hardware DDC/CI · Built-in Audio</div>
        </div>
        <div class="status-badge" id="status-badge">
          <span class="status-dot" id="status-dot"></span>
          <span id="status" role="status">Connecting…</span>
        </div>
      </section>

      <!-- Volume Control Section -->
      <section class="control-card">
        <div class="card-header">
          <span class="section-label">Master Volume</span>
          <output id="value" class="volume-display">—</output>
        </div>

        <!-- Slider Capsule Track -->
        <div class="slider-wrapper">
          <button id="speaker-icon-btn" class="speaker-pill-btn" title="Toggle mute" disabled>
            <svg id="speaker-svg" class="speaker-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path class="wave wave-1" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              <path class="wave wave-2" d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            </svg>
          </button>
          <div class="range-track-container">
            <input id="volume" type="range" min="0" max="100" step="1" value="0" disabled aria-label="Monitor volume">
          </div>
        </div>

        <!-- Stepper and Presets -->
        <div class="presets-row">
          <div class="steppers-group">
            <button id="down-5" class="pill-btn step-btn" data-step="-5" disabled title="Decrease by 5%">−5%</button>
            <button id="down" class="pill-btn step-btn step-fine" data-step="-1" disabled title="Decrease by 1% (fine step)">−1%</button>
            <button id="up" class="pill-btn step-btn step-fine" data-step="1" disabled title="Increase by 1% (fine step)">+1%</button>
            <button id="up-5" class="pill-btn step-btn" data-step="5" disabled title="Increase by 5%">+5%</button>
          </div>
          <div class="quick-presets">
            <button class="preset-chip" data-val="25">25%</button>
            <button class="preset-chip" data-val="50">50%</button>
            <button class="preset-chip" data-val="75">75%</button>
            <button class="preset-chip" data-val="100">100%</button>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="actions-grid">
          <button id="mute" class="action-btn" disabled>
            <svg class="action-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <line class="mute-slash" x1="23" y1="9" x2="17" y2="15"/>
              <line class="mute-slash" x1="17" y1="9" x2="23" y2="15"/>
            </svg>
            <span id="mute-label">Mute</span>
          </button>
          <button id="refresh" class="action-btn">
            <svg class="action-icon refresh-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/>
              <polyline points="1 20 1 14 7 14"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
            <span>Refresh</span>
          </button>
        </div>
      </section>

      <!-- Footer Info -->
      <footer class="app-footer">
        <span class="shortcut-tip">
          <span class="shortcut-label">Shortcuts:</span>
          <kbd>Ctrl</kbd>+<kbd>Alt</kbd>+<kbd>↑/↓</kbd> (±2%), <kbd>Shift</kbd> (±1%)
        </span>
      </footer>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
