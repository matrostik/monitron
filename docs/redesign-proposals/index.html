<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitron - Design Variants Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #07090D;
      color: #E0E2EA;
      font-family: 'Inter', sans-serif;
    }
    .variant-btn {
      transition: all 0.15s ease-in-out;
    }
    .variant-btn.active {
      background-color: #1E293B;
      color: #FFFFFF;
      font-weight: 600;
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.6);
    }
    .variant-btn.active[data-accent="orange"] {
      border-color: rgba(255, 69, 0, 0.8);
      color: #FF5722;
      background-color: rgba(255, 69, 0, 0.12);
      box-shadow: 0 0 16px rgba(255, 69, 0, 0.35);
    }
    .variant-btn.active[data-accent="amber"] {
      border-color: rgba(255, 176, 0, 0.8);
      color: #FFB000;
      background-color: rgba(255, 176, 0, 0.12);
      box-shadow: 0 0 16px rgba(255, 176, 0, 0.35);
    }
    .variant-btn.active[data-accent="cyan"] {
      border-color: rgba(6, 182, 212, 0.8);
      color: #38BDF8;
      background-color: rgba(6, 182, 212, 0.12);
      box-shadow: 0 0 16px rgba(6, 182, 212, 0.3);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col m-0 p-0 overflow-hidden">
  <!-- Top Navigation & Switcher Bar -->
  <header class="bg-[#0E1015] border-b border-slate-800 z-50 px-5 py-3 flex flex-wrap items-center justify-between gap-3 shrink-0">

      <div class="w-8 h-8 rounded-lg bg-orange-500/15 border border-orange-500/40 flex items-center justify-center text-orange-400 font-bold font-mono text-sm">
        M
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-semibold text-white tracking-tight text-sm">Monitron UI Explorer</span>
          <span class="text-[10px] font-mono uppercase px-2 py-0.5 rounded bg-amber-500/15 border border-amber-500/40 text-amber-400 font-semibold">5 Designs Available</span>
        </div>
        <p class="text-xs text-slate-400" id="currentThemeDesc">Variant A: Warm Milled Aluminum &amp; Safety Orange (Teenage Engineering / Dieter Rams Braun)</p>
      </div>
    </div>

    <!-- Screen Switcher Tabs -->
    <nav class="flex items-center gap-1.5 bg-[#050608] p-1 rounded-xl border border-slate-800 shadow-inner flex-wrap">
      <!-- Variant 1: Industrial Studio -->
      <button onclick="selectVariant('industrial', this, 'orange', 'Variant A: Precision Instrument Studio — Warm milled aluminum, matte black keycaps, safety orange &amp; cadmium yellow, Swiss DIN labels, mechanical fader with VU-meter ladder.')" 
              data-accent="orange" 
              class="variant-btn active px-3 py-1.5 rounded-lg text-xs font-medium border border-transparent transition-all flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-orange-500 shadow-[0_0_6px_#FF4500]"></span>
        <span>Variant A: Industrial (Braun)</span>
      </button>

      <!-- Variant 2: Amber Phosphor Avionics -->
      <button onclick="selectVariant('amber', this, 'amber', 'Variant B: Amber Phosphor Cyber-Avionics — Deep pitch carbon void, 590nm glowing amber phosphor, oscilloscope waveform, 270° circular radar dials, CRT scanlines.')" 
              data-accent="amber" 
              class="variant-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 border border-transparent transition-all flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_6px_#FFB000]"></span>
        <span>Variant B: Amber Avionics</span>
      </button>

      <!-- Variant 3: Dark Slate / Electric Cyan -->
      <button onclick="selectVariant('cyan-main', this, 'cyan', 'Variant C: Precision Optics Dark Utility — Translucent frosted slate glass (#101419), electric cyan (#06B6D4) and emerald accents, native macOS utility feel.')"

              class="variant-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 border border-transparent transition-all flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
        <span>Variant C: Precision Optics</span>
      </button>

      <!-- Subscreen: Inputs Tab -->
      <button onclick="selectVariant('cyan-inputs', this, 'cyan', 'Inputs &amp; Topology View — Dedicated 32:9 curved ultrawide visualizer, live telemetry, and multi-port source matrix.')" 
              data-accent="cyan" 
              class="variant-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 border border-transparent transition-all">
        Inputs View
      </button>

      <!-- Subscreen: Settings Modal -->
      <button onclick="selectVariant('cyan-settings', this, 'cyan', 'Settings &amp; Preferences Modal — 4-tab preferences modal for appearance, step sizes, custom port names, and global shortcuts.')" 
              data-accent="cyan" 
              class="variant-btn px-3 py-1.5 rounded-lg text-xs font-medium text-slate-400 hover:text-slate-200 border border-transparent transition-all">
        Settings Modal
      </button>
    </nav>
  </header>

  <main class="flex-1 w-full bg-[#07090D] relative overflow-hidden">
    <iframe id="previewFrame" class="w-full h-full border-0 absolute inset-0" title="Screen Preview"></iframe>
  </main>

n-surface transition-colors active:scale-95\">\n<span class=\"material-symbols-outlined text-[16px] text-outline\">schedule</span>\n<span>Wake Schedule</span>\n</button>\n<button class=\"flex items-center gap-1.5 bg-surface-container-high hover:bg-tertiary-container/30 border border-tertiary/30 text-tertiary rounded-lg px-space-md py-1 font-headline-sm text-body-sm transition-colors active:scale-95 shadow-sm\" id=\"sleepDisplayBtn\">\n<span class=\"material-symbols-outlined text-[16px]\">bedtime</span>\n<span>Sleep Display</span>\n</button>\n</div>\n</div>\n</section>\n</div>\n<\!-- SHARED COMPONENT: Footer (Exact Execution from JSON) -->\n<footer class=\"bg-surface-container-lowest dark:bg-surface-container-lowest border-t border-outline-variant/20\">\n<div class=\"flex justify-between items-center w-full px-space-md py-space-xs text-label-technical font-label-technical\">\n<\!-- Left status readout -->\n<div class=\"flex items-center gap-2 text-outline dark:text-outline\">\n<span class=\"inline-block w-1.5 h-1.5 rounded-full bg-secondary\"></span>\n<span>\u25cf DDC/CI Bus 0x37 \u00b7 Response time 14ms</span>\n<span class=\"text-outline-variant\">|</span>\n<span class=\"text-outline text-label-technical\">Monitron DDC/CI Core Engine v2.4</span>\n</div>\n<\!-- Center links from JSON: [\"\u23181 Quick Sync\", \"\u2318K Switch Input\", \"Esc Standby\"] -->\n<div class=\"hidden md:flex items-center gap-space-md\">\n<button class=\"text-outline dark:text-outline hover:text-on-surface dark:hover:text-on-surface transition-colors\">\u23181 Quick Sync</button>\n<button class=\"text-outline dark:text-outline hover:text-on-surface dark:hover:text-on-surface transition-colors\">\u2318K Switch Input</button>\n<button class=\"text-outline dark:text-outline hover:text-on-surface dark:hover:text-on-surface transition-colors\">Esc Standby</button>\n</div>\n<\!-- Trailing Auto-sync toggle & active indicator -->\n<div class=\"flex items-center gap-space-sm text-primary dark:text-primary\">\n<span class=\"text-outline\">Auto-Sync: 15s</span>\n<label class=\"relative inline-flex items-center cursor-pointer\">\n<input checked=\"\" class=\"sr-only peer\" id=\"autoSyncToggle\" type=\"checkbox\"/>\n<div class=\"w-7 h-4 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-primary-container\"></div>\n</label>\n</div>\n</div>\n</footer>\n</main>\n<\!-- Interactive Logic Engine -->\n<script>\n    document.addEventListener('DOMContentLoaded', () => {\n      // 1. Speaker Volume Control\n      const volumeSlider = document.getElementById('volumeSlider');\n      const volumeTrackFill = document.getElementById('volumeTrackFill');\n      const volumeReadout = document.getElementById('volumeValueReadout');\n      const volumeMuteBtn = document.getElementById('volumeMuteBtn');\n      const volumeMuteIcon = document.getElementById('volumeMuteIcon');\n      let isMuted = false;\n      let lastVolume = 68;\n\n      function updateVolume(val) {\n        val = Math.max(0, Math.min(100, parseInt(val)));\n        volumeSlider.value = val;\n        volumeTrackFill.style.width = val + '%';\n        volumeReadout.textContent = val + '%';\n        if (val === 0) {\n          volumeMuteIcon.textContent = 'volume_off';\n          volumeMuteBtn.classList.remove('text-primary', 'border-primary/30');\n          volumeMuteBtn.classList.add('text-error', 'border-error/40');\n        } else {\n          volumeMuteIcon.textContent = 'volume_up';\n          volumeMuteBtn.classList.remove('text-error', 'border-error/40');\n          volumeMuteBtn.classList.add('text-primary', 'border-primary/30');\n        }\n      }\n\n      volumeSlider.addEventListener('input', (e) => updateVolume(e.target.value));\n\n      document.querySelectorAll('.vol-step').forEach(btn => {\n        btn.addEventListener('click', () => {\n          const delta = parseInt(btn.dataset.delta);\n          updateVolume(parseInt(volumeSlider.value) + delta);\n        });\n      });\n\n      document.querySelectorAll('.vol-preset').forEach(btn => {\n        btn.addEventListener('click', () => updateVolume(btn.dataset.target));\n      });\n\n      volumeMuteBtn.addEventListener('click', () => {\n        if (!isMuted) {\n          lastVolume = parseInt(volumeSlider.value) || 50;\n          updateVolume(0);\n          isMuted = true;\n        } else {\n          updateVolume(lastVolume);\n          isMuted = false;\n        }\n      });\n\n      // 2. Brightness Control\n      const brightSlider = document.getElementById('brightSlider');\n      const brightTrackFill = document.getElementById('brightTrackFill');\n      const brightReadout = document.getElementById('brightValueReadout');\n\n      function updateBrightness(val) {\n        val = Math.max(0, Math.min(100, parseInt(val)));\n        brightSlider.value = val;\n        brightTrackFill.style.width = val + '%';\n        brightReadout.textContent = val + '%';\n      }\n\n      brightSlider.addEventListener('input', (e) => updateBrightness(e.target.value));\n\n      document.querySelectorAll('.bright-step').forEach(btn => {\n        btn.addEventListener('click', () => {\n          const delta = parseInt(btn.dataset.delta);\n          updateBrightness(parseInt(brightSlider.value) + delta);\n        });\n      });\n\n      document.querySelectorAll('.bright-preset').forEach(btn => {\n        btn.addEventListener('click', () => updateBrightness(btn.dataset.target));\n      });\n\n      // 3. Contrast Control\n      const contrastSlider = document.getElementById('contrastSlider');\n      const contrastTrackFill = document.getElementById('contrastTrackFill');\n      const contrastReadout = document.getElementById('contrastValueReadout');\n\n      function updateContrast(val) {\n        val = Math.max(0, Math.min(100, parseInt(val)));\n        contrastSlider.value = val;\n        contrastTrackFill.style.width = val + '%';\n        contrastReadout.textContent = val + '%';\n      }\n\n      contrastSlider.addEventListener('input', (e) => updateContrast(e.target.value));\n\n      document.querySelectorAll('.contrast-step').forEach(btn => {\n        btn.addEventListener('click', () => {\n          const delta = parseInt(btn.dataset.delta);\n          updateContrast(parseInt(contrastSlider.value) + delta);\n        });\n      });\n\n      document.querySelectorAll('.contrast-preset').forEach(btn => {\n        btn.addEventListener('click', () => updateContrast(btn.dataset.target));\n      });\n\n      // 4. Input Selector Cards\n      const inputCards = document.querySelectorAll('.input-card');\n      const activeInputLabel = document.getElementById('activeInputLabel');\n\n      inputCards.forEach(card => {\n        card.addEventListener('click', () => {\n          inputCards.forEach(c => {\n            c.classList.remove('border-primary', 'bg-primary/5', 'shadow-[0_0_12px_rgba(6,182,212,0.25)]');\n            c.classList.add('border-outline-variant/40', 'bg-surface-container-low');\n            const check = c.querySelector('.check-icon');\n            if (check) check.classList.add('hidden');\n          });\n\n          card.classList.remove('border-outline-variant/40', 'bg-surface-container-low');\n          card.classList.add('border-primary', 'bg-primary/5', 'shadow-[0_0_12px_rgba(6,182,212,0.25)]');\n          const check = card.querySelector('.check-icon');\n          if (check) check.classList.remove('hidden');\n\n          const inputName = card.getAttribute('data-input');\n          if (inputName && activeInputLabel) {\n            activeInputLabel.textContent = inputName;\n          }\n        });\n      });\n\n      // 5. Hardware Actions Feedback\n      const syncBtn = document.getElementById('syncDdcBtn');\n      const syncIcon = document.getElementById('syncIcon');\n      syncBtn.addEventListener('click', () => {\n        syncIcon.classList.add('rotate-180');\n        setTimeout(() => syncIcon.classList.remove('rotate-180'), 700);\n      });\n\n      const reloadBusBtn = document.getElementById('reloadBusBtn');\n      if (reloadBusBtn) {\n        reloadBusBtn.addEventListener('click', () => {\n          reloadBusBtn.classList.add('rotate-180');\n          setTimeout(() => reloadBusBtn.classList.remove('rotate-180'), 600);\n        });\n      }\n\n      const quickDimBtn = document.getElementById('quickDimBtn');\n      let isDimmed = false;\n      let prevBrightness = 75;\n      quickDimBtn.addEventListener('click', () => {\n        if (!isDimmed) {\n          prevBrightness = parseInt(brightSlider.value);\n          updateBrightness(10);\n          isDimmed = true;\n          quickDimBtn.classList.add('text-primary');\n        } else {\n          updateBrightness(prevBrightness);\n          isDimmed = false;\n          quickDimBtn.classList.remove('text-primary');\n        }\n      });\n\n      const sleepDisplayBtn = document.getElementById('sleepDisplayBtn');\n      const powerStandbyQuickBtn = document.getElementById('powerStandbyQuickBtn');\n      [sleepDisplayBtn, powerStandbyQuickBtn].forEach(btn => {\n        if (!btn) return;\n        btn.addEventListener('click', () => {\n          const original = btn.innerHTML;\n          btn.innerHTML = `<span class=\"material-symbols-outlined text-[16px] text-tertiary\">hourglass_top</span><span>DPMS Standby...</span>`;\n          setTimeout(() => {\n            btn.innerHTML = original;\n          }, 1500);\n        });\n      });\n    });\n  <\/script>\n</body></html>", "cyan-inputs": "<!DOCTYPE html>\n\n<html class=\"dark\" lang=\"en\"><head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>Monitron - Inputs &amp; Display Management</title>\n<\!-- Fonts -->\ ne\">link_off</span>\n</div>\n</div>\n<\!-- Port 4: USB-C (VCP 0x12) -->\n<div class=\"flex items-center justify-between p-2 rounded-md bg-surface-container-low border border-outline-variant/30\">\n<div class=\"flex items-center gap-3\">\n<\!-- Toggle Switch (ON) -->\n<div class=\"w-8 h-4 bg-primary rounded-full p-0.5 flex items-center justify-end shadow-sm cursor-pointer\" style=\"box-shadow: 0 0 8px rgba(6, 182, 212, 0.4);\">\n<div class=\"w-3 h-3 bg-surface-container-lowest rounded-full\"></div>\n</div>\n<div>\n<div class=\"flex items-center gap-1.5\">\n<span class=\"text-body-sm font-body-sm font-medium text-on-surface\">USB-C</span>\n<span class=\"text-label-technical font-label-technical text-outline\">VCP 0x12</span>\n</div>\n<div class=\"text-label-technical font-label-technical text-on-surface-variant\">90W PD Charging</div>\n</div>\n</div>\n<div class=\"flex items-center gap-2\">\n<span class=\"text-label-technical font-label-technical text-outline hidden sm:inline\">Alias:</span>\n<input class=\"w-32 px-2 py-1 rounded bg-surface-container-lowest border border-outline-variant/40 text-on-surface text-body-sm font-body-sm focus:border-primary focus:outline-none\" type=\"text\" value=\"MacBook Air\"/>\n<span class=\"material-symbols-outlined text-[16px] text-outline\">link_off</span>\n</div>\n</div>\n</div>\n</div>\n</section>\n<\!-- SECTION 3: SHORTCUTS & KEYBINDINGS -->\n<section class=\"space-y-space-md scroll-mt-2\" id=\"panel-shortcuts\">\n<div class=\"flex items-center justify-between pb-1 border-b border-outline-variant/20\">\n<div class=\"flex items-center gap-2\">\n<span class=\"material-symbols-outlined text-primary text-[18px]\">keyboard</span>\n<h2 class=\"text-headline-sm font-headline-sm text-on-surface font-semibold\">Shortcuts &amp; Keybindings</h2>\n</div>\n<span class=\"text-label-technical font-label-technical text-outline\">HOTKEY_DAEMON</span>\n</div>\n<\!-- Master Global Hotkeys & Media Key Override Card -->\n<div class=\"p-space-md rounded-lg bg-surface-container border border-outline-variant/30 space-y-space-md\">\n<div class=\"flex items-center justify-between pb-2 border-b border-outline-variant/20\">\n<div class=\"flex items-center gap-2.5\">\n<div>\n<div class=\"text-body-md font-body-md text-on-surface font-medium\">Enable Global Hotkeys</div>\n<div class=\"text-body-sm font-body-sm text-on-surface-variant\">Capture physical keyboard chords system-wide</div>\n</div>\n<\!-- Glowing Cyan Pill 'Active' -->\n<span class=\"px-2 py-0.5 rounded-full bg-primary/10 text-primary border border-primary/30 text-label-technical font-label-technical font-medium\" style=\"box-shadow: 0 0 8px rgba(6, 182, 212, 0.3);\">Active</span>\n</div>\n<\!-- Master Toggle Switch (ON) -->\n<div class=\"w-10 h-5 bg-primary rounded-full p-0.5 cursor-pointer flex items-center justify-end shadow-sm\" style=\"box-shadow: 0 0 10px rgba(6, 182, 212, 0.4);\">\n<div class=\"w-4 h-4 bg-surface-container-lowest rounded-full shadow-md\"></div>\n</div>\n</div>\n<div class=\"flex items-center justify-between\">\n<div>\n<div class=\"text-body-md font-body-md text-on-surface font-medium\">Media Key Override</div>\n<div class=\"text-body-sm font-body-sm text-on-surface-variant\">Map macOS F1/F2 brightness and F11/F12 volume directly to external monitor DDC/CI</div>\n</div>\n<\!-- Toggle Switch (ON) -->\n<div class=\"w-10 h-5 bg-primary rounded-full p-0.5 cursor-pointer flex items-center justify-end shadow-sm\" style=\"box-shadow: 0 0 10px rgba(6, 182, 212, 0.4);\">\n<div class=\"w-4 h-4 bg-surface-container-lowest rounded-full shadow-md\"></div>\n</div>\n</div>\n</div>\n<\!-- Keyboard Shortcut Recorder Cards with Dark Keycap Pills -->\n<div class=\"p-space-md rounded-lg bg-surface-container border border-outline-variant/30 space-y-space-sm\">\n<div class=\"flex items-center justify-between\">\n<span class=\"text-body-md font-body-md text-on-surface font-medium\">Hardware Action Hotkey Map</span>\n<span class=\"text-label-technical font-label-technical text-outline\">Click keycap to rebind</span>\n</div>\n<div class=\"space-y-2 pt-1\">\n<\!-- Row 1: Volume Up -->\n<div class=\"flex items-center justify-between p-2 rounded-md bg-surface-container-low border border-outline-variant/30\">\n<div>\n<span class=\"text-body-sm font-body-sm text-on-surface font-medium\">Volume Up</span>\n<span class=\"block text-label-technical font-label-technical text-outline\">Shift holds fine step 1%</span>\n</div>\n<div class=\"flex items-center gap-1.5\">\n<kbd class=\"px-2 py-1 rounded bg-surface-container-lowest border border-outline-variant/40 text-on-surface text-label-technical font-label-technical shadow-sm\">Ctrl</kbd>\n<kbd class=\"px-2 py-1 rounded bg-surface-container-lowest border border-outline-variant/40 text-on-surface text-label-technical font-label-technical shadow-sm\">Shift</kbd>\n<kbd class=\"px-2 py-1 rounded bg-surface-container-lowest border border-primary/40 text-primary text-label-technical font-label-technical shadow-sm font-medium\">F12</kbd>\n</div>\n</div>\n<\!-- Row 2: Volume Down -->\n<div class=\"flex items-center justify-between p-2 rounded-md bg-surface-container-low border border-outline-variant/30\">\n<div>\n<span class=\"text-body-sm font-body-sm text-on-surface font-medium\">Volume Down</span>\n<span class=\"block text-label-technical font-label-technical text-outline\">Shift holds fine step 1%</span>\n</div>\n<div class=\"flex items-center gap-1.5\">\n<kbd class=\"px-2 py-1 rounded bg-surface-container-lowest border border-outline-variant/40 text-on-surface text-label-technical font-label-technical shadow-sm\">Ctrl</kbd>\n<kbd class=\"px-2 py-1 rounded bg-surface-container-lowest border border-outline-variant/40 text-on-surface text-label-technical font-label-technical shadow-sm\">Shift</kbd>\n<kbd class=\"px-2 py-1 rounded bg-surface-container-lowest border border-primary/40 text-primary text-label-technical font-label-technical shadow-sm font-medium\">F11</kbd>\n</div>\n</div>\n<\!-- Row 3: Brightness Up -->\n<div class=\"flex items-center justify-between p-2 rounded-md bg-surface-container-low border border-outline-variant/30\">\n<div>\n<span class=\"text-body-sm font-body-sm text-on-surface font-medium\">Brightness Up</span>\n<span class=\"block text-label-technical font-label-technical text-outline\">+10% step (Shift holds 1%)</span>\n</div>\n<div class=\"flex items-center gap-1.5\">\n<kbd class=\"px-2 py-1 rounded bg-surface-container-lowest border border-outline-variant/40 text-on-surface text-label-technical font-label-technical shadow-sm\">Ctrl</kbd>\n<kbd class=\"px-2 py-1 rounded bg-surface-container-lowest border border-outline-variant/40 text-on-surface text-label-technical font-label-technical shadow-sm\">Alt</kbd>\n<kbd class=\"px-2 py-1 rounded bg-surface-container-lowest border border-primary/40 text-primary text-label-technical font-label-technical shadow-sm font-medium\">F12</kbd>\n</div>\n</div>\n<\!-- Row 4: Brightness Down -->\n<div class=\"flex items-center justify-between p-2 rounded-md bg-surface-container-low border border-outline-variant/30\">\n<div>\n<span class=\"text-body-sm font-body-sm text-on-surface font-medium\">Brightness Down</span>\n<span class=\"block text-label-technical font-label-technical text-outline\">-10% step (Shift holds 1%)</span>\n</div>\n<div class=\"flex items-center gap-1.5\">\n<kbd class=\"px-2 py-1 rounded bg-surface-container-lowest border border-outline-variant/40 text-on-surface text-label-technical font-label-technical shadow-sm\">Ctrl</kbd>\n<kbd class=\"px-2 py-1 rounded bg-surface-container-lowest border border-outline-variant/40 text-on-surface text-label-technical font-label-technical shadow-sm\">Alt</kbd>\n<kbd class=\"px-2 py-1 rounded bg-surface-container-lowest border border-primary/40 text-primary text-label-technical font-label-technical shadow-sm font-medium\">F11</kbd>\n</div>\n</div>\n<\!-- Row 5: Quick Input Switch -->\n<div class=\"flex items-center justify-between p-2 rounded-md bg-surface-container-low border border-outline-variant/30\">\n<div>\n<span class=\"text-body-sm font-body-sm text-on-surface font-medium\">Quick Input Switch</span>\n<span class=\"block text-label-technical font-label-technical text-outline\">cycles detected active ports</span>\n</div>\n<div class=\"flex items-center gap-1.5\">\n<kbd class=\"px-2 py-1 rounded bg-surface-container-lowest border border-outline-variant/40 text-on-surface text-label-technical font-label-technical shadow-sm\">Ctrl</kbd>\n<kbd class=\"px-2.5 py-1 rounded bg-surface-container-lowest border border-primary/40 text-primary text-label-technical font-label-technical shadow-sm font-medium\">Space</kbd>\n</div>\n</div>\n</div>\n</div>\n</section>\n<\!-- SECTION 4: ABOUT & DIAGNOSTICS -->\n<section class=\"space-y-space-md scroll-mt-2\" id=\"panel-diagnostics\">\n<div class=\"flex items-center justify-between pb-1 border-b border-outline-variant/20\">\n<div class=\"flex items-center gap-2\">\n<span class=\"material-symbols-outlined text-primary text-[18px]\">memory</span>\n<h2 class=\"text-headline-sm font-headline-sm text-on-surface font-semibold\">About &amp; Diagnostics</h2>\n</div>\n<span class=\"text-label-technical font-label-technical text-outline\">KERNEL_M1DDC</span>\n</div>\n<\!-- Hardware & Runtime Card -->\n<div class=\"p-space-md rounded-lg bg-surface-container border border-outline-variant/30 space-y-space-sm\">\n<div class=\"flex items-start justify-between\">\n<div class=\"space-y-1\">\n<div class=\"text-headline-sm font-headline-sm text-on-surface font-semibold tracking-tight\">Monitron v2.4.0</div>\n<div class=\"text-body-sm font-body-sm text-on-surface-variant\">Electron 32 \u00b7 Node 20 \u00b7 Windows dxva2 / macOS m1ddc engine</div>\n</div>\n<span class=\"px-2 py-0.5 rounded bg-surface-container-highest text-secondary border border-secondary/30 text-label-technical font-label-technical\">PROBE OK</span>\n</div>\n<div class=\"p-2.5 rounded-md bg-surface-container-lowest border border-outline-variant/20 font-label-technical text-label-technical space-y-1 text-on-surface-variant\">\n<div class=\"text-on-surface font-medium\">Connected Display: LG 49WQ95C-W</div>\n<div>VCP v2.2 compliant \u00b7 I\u00b2C Bus 0x37 \u00b7 Handshake: 14ms</div>\n<div class=\"text-outline break-all\">Capabilities String: (prot(monitor)type(LCD)model(49WQ95C)cmds(01 02 03 07 0C E3 F3)vcp(02 04 05 06 08 10 12 14(05 08 0B 0C) 16 18 1A 52 60(0F 10 11 12) 62 AC AE B2 B6 C6 C8 C9 CA CC(02 03 04 06 09 0A 0D) D6(01 04 05) DC(00 02 03 05) DF FD))</div>\n</div>\n</div>\n<\!-- Action Buttons Toolbar -->\n<div class=\"flex items-center gap-2\">\n<\!-- Open Config Folder -->\n<button class=\"flex-1 flex items-center justify-center gap-1.5 py-1.5 px-3 rounded-md bg-surface-container border border-outline-variant/30 hover:bg-surface-container-high text-on-surface-variant hover:text-on-surface transition-colors text-body-sm font-body-sm active:scale-[0.98]\">\n<span class=\"material-symbols-outlined text-[16px]\">folder</span>\n<span>Open Config Folder</span>\n</button>\n<\!-- Run DDC/CI Probe Diagnostics -->\n<button class=\"flex-1 flex items-center justify-center gap-1.5 py-1.5 px-3 rounded-md bg-primary-container/20 border border-primary/40 hover:bg-primary-container/30 text-primary transition-colors text-body-sm font-body-sm font-medium active:scale-[0.98]\">\n<span class=\"material-symbols-outlined text-[16px] animate-pulse\">monitoring</span>\n<span>Run DDC/CI Probe Diagnostics</span>\n</button>\n<\!-- Copy Diagnostic Info -->\n<button class=\"flex-1 flex items-center justify-center gap-1.5 py-1.5 px-3 rounded-md bg-surface-container border border-outline-variant/30 hover:bg-surface-container-high text-on-surface-variant hover:text-on-surface transition-colors text-body-sm font-body-sm active:scale-[0.98]\">\n<span class=\"material-symbols-outlined text-[16px]\">content_copy</span>\n<span>Copy Diagnostic Info</span>\n</button>\n</div>\n</section>\n</main>\n<\!-- Footer Status Bar -->\n<footer class=\"flex justify-between items-center w-full px-space-md py-space-xs bg-surface-container-lowest border-t border-outline-variant/20 text-label-technical font-label-technical select-none\">\n<div class=\"flex items-center gap-2 text-outline\">\n<span class=\"w-2 h-2 rounded-full bg-secondary shadow-sm\"></span>\n<span class=\"text-on-surface-variant font-medium\">Monitron DDC/CI Core Engine v2.4</span>\n<span class=\"text-outline-variant\">|</span>\n<span>Bus 0x37</span>\n<span class=\"text-outline-variant\">|</span>\n<span class=\"text-secondary\">Response 14ms</span>\n</div>\n<\!-- Quick keyboard helper links -->\n<div class=\"flex items-center gap-3\">\n<span class=\"text-primary hover:text-on-surface transition-colors cursor-pointer\">\u23181 Quick Sync</span>\n<span class=\"text-outline hover:text-on-surface transition-colors cursor-pointer\">\u2318K Switch Input</span>\n<span class=\"text-outline hover:text-on-surface transition-colors cursor-pointer\">Esc Standby</span>\n</div>\n</footer>\n</div>\n<script>\n    // Tab switching & smooth scroll micro-interaction\n    const tabButtons = document.querySelectorAll('.tab-btn');\n    const scrollContainer = document.getElementById('settingsScrollContainer');\n\n    tabButtons.forEach(btn => {\n      btn.addEventListener('click', () => {\n        const targetId = btn.getAttribute('data-target');\n\n        // Style active and inactive tabs\n        tabButtons.forEach(b => {\n          b.className = 'tab-btn flex items-center justify-center gap-1.5 py-1.5 px-space-sm rounded-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high/60 transition-colors text-label-technical font-label-technical active:scale-[0.98]';\n        });\n        btn.className = 'tab-btn flex items-center justify-center gap-1.5 py-1.5 px-space-sm rounded-md bg-surface-container-highest text-primary border border-primary/30 shadow-sm text-label-technical font-label-technical transition-all active:scale-[0.98]';\n\n        // Scroll the targeted panel smoothly into view inside the canvas\n        const targetElement = document.getElementById(targetId);\n        if (targetElement && scrollContainer) {\n          const offsetTop = targetElement.offsetTop - scrollContainer.offsetTop;\n          scrollContainer.scrollTo({ top: offsetTop, behavior: 'smooth' });\n        }\n      });\n    });\n\n    // Auto highlight tab on scroll\n    scrollContainer.addEventListener('scroll', () => {\n      const scrollPos = scrollContainer.scrollTop + 60;\n      const sections = ['panel-general', 'panel-levels', 'panel-shortcuts', 'panel-diagnostics'];\n\n      sections.forEach(id => {\n        const el = document.getElementById(id);\n        if (el) {\n          const top = el.offsetTop - scrollContainer.offsetTop;\n          const height = el.offsetHeight;\n          if (scrollPos >= top && scrollPos < top + height) {\n            tabButtons.forEach(btn => {\n              if (btn.getAttribute('data-target') === id) {\n                btn.className = 'tab-btn flex items-center justify-center gap-1.5 py-1.5 px-space-sm rounded-md bg-surface-container-highest text-primary border border-primary/30 shadow-sm text-label-technical font-label-technical transition-all active:scale-[0.98]';\n              } else {\n                btn.className = 'tab-btn flex items-center justify-center gap-1.5 py-1.5 px-space-sm rounded-md text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high/60 transition-colors text-label-technical font-label-technical active:scale-[0.98]';\n              }\n            });\n          }\n        }\n      });\n    });\n  <\/script>\n</body></html>"};

    function selectVariant(key, btn, accent, desc) {
      const frame = document.getElementById('previewFrame');
      const html = screenData[key];
      if (html) {
        frame.srcdoc = html;
      }
      document.getElementById('currentThemeDesc').textContent = desc;
      document.querySelectorAll('.variant-btn').forEach(b => {
        b.classList.remove('active');
        b.classList.add('text-slate-400');
      });
      btn.classList.add('active');
      btn.classList.remove('text-slate-400');
    }

    // Initialize with first variant on page load
    window.addEventListener('DOMContentLoaded', () => {
      const frame = document.getElementById('previewFrame');
      if (screenData['industrial']) {
        frame.srcdoc = screenData['industrial'];
      }
    });
  </script>
